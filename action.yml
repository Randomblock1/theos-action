name: "Install Theos"
description: "Install Theos and prepare it for building projects"
author: "Randomblock1"
branding:
  icon: download-cloud
  color: purple

inputs:
  theos-dir:
    description: "Where to install Theos"
    required: false
    default: ${{ github.workspace }}/theos
  theos-src:
    description: "Where to clone Theos from (git URL)"
    required: false
    default: "https://github.com/theos/theos"
  theos-sdks:
    description: "Where to clone the iOS SDKs from (GitHub repository URL)"
    required: false
    default: "https://github.com/theos/sdks"
  theos-sdks-branch:
    description: "Which branch to clone from SDK repo"
    required: false
    default: "master"
  orion:
    description: "Deprecated. This input no longer has any effect."
    required: false
    default: "false"
    deprecationMessage: "No longer needed because Orion support is always enabled."

runs:
  using: "composite"
  steps:
    - name: Setup (MacOS)
      shell: bash
      if: runner.os == 'macOS'
      run: |
        brew install ldid make
        PATH="$(brew --prefix make)/libexec/gnubin:$PATH" >> $GITHUB_ENV

    - name: Setup (Linux)
      shell: bash
      if: runner.os == 'Linux'
      run: |
        available() { apt-cache policy "$1" 2>/dev/null | grep 'Candidate: [^(]' >/dev/null; }
        # Ubuntu 26.04+ replaced libxml2 (libxml2.so.2) with libxml2-16 (libxml2.so.16)
        LIBXML2=$(available libxml2 && echo libxml2 || echo libxml2-16)
        # Ubuntu 26.04+ split ld.gold, which the toolchain's swiftc links host tools with, out of binutils
        GOLD=$(available binutils-gold && echo binutils-gold || true)
        sudo apt install build-essential fakeroot rsync curl perl zip git $LIBXML2 $GOLD libncurses6 libtinfo6 libz3-dev libplist-utils
        # The toolchain's swift-build, lld and lldb won't start without libxml2.so.2. Theos builds
        # work with it pointing at libxml2.so.16; the loader only prints a harmless
        # "no version information available" warning.
        LIBDIR=/usr/lib/$(dpkg-architecture -qDEB_HOST_MULTIARCH)
        if [ ! -e $LIBDIR/libxml2.so.2 ] && [ -e $LIBDIR/libxml2.so.16 ]; then
          sudo ln -s libxml2.so.16 $LIBDIR/libxml2.so.2
        fi

    - name: Setup environment
      shell: bash
      run: echo "THEOS=${{ inputs.theos-dir }}" >> $GITHUB_ENV

    - name: Download Theos
      shell: bash
      run: |
        if [ ! -d "${{ inputs.theos-dir }}" ]; then
          git clone ${{ inputs.theos-src }} ${{ inputs.theos-dir }} --recursive
          echo "Theos successfully downloaded."
        else
          echo "Theos already cached."
        fi

    - name: Get toolchain (Linux)
      shell: bash
      if: runner.os == 'Linux'
      run: |
        if [[ "$(ls ${{ inputs.theos-dir }}/sdks)" ]]; then
          echo "Linux toolchain already cached, skipping..."
        else
          TMP_DL=$(mktemp -d)
          wget --no-verbose https://github.com/kabiroberai/swift-toolchain-linux/releases/download/v2.3.0/swift-5.8-ubuntu22.04.tar.xz -P $TMP_DL
          tar -xf $TMP_DL/swift-5.8-ubuntu22.04.tar.xz -C $THEOS/toolchain
          rm -Rf $TMP_DL
        fi

    - name: Get SDKs
      shell: bash
      run: |
        if [[ "$(ls ${{ inputs.theos-dir }}/sdks)" ]]; then
          echo "Theos SDKs already cached, skipping..."
        else
          cd ${{ inputs.theos-dir }}/sdks
          # tar.gz, not zip: macOS unzip fails on symlinks with absolute targets, which the SDKs contain
          wget --no-verbose ${{ inputs.theos-sdks }}/archive/${{ inputs.theos-sdks-branch }}.tar.gz
          TMP=$(mktemp -d)
          tar -xzf ${{ inputs.theos-sdks-branch }}.tar.gz -C $TMP
          mv $TMP/*-${{ inputs.theos-sdks-branch }}/*.sdk $THEOS/sdks
          rm -r ${{ inputs.theos-sdks-branch }}.tar.gz $TMP
        fi
